# Nav2 de competencia (lo carga launch/exploracion.launch.py, incluido por competencia.launch.py).

amcl:
  ros__parameters:
    # Base: ajuste del equipo (params/nav2.yaml, probado contra el perfil
    # "stress" del simulador): alphas 0.6 para seguir una odometría mecanum que
    # patina/deriva, mucha confianza en el láser, corrección cada 5 cm / 0.05 rad.
    # + beam skipping (likelihood_field_prob): si >30% de las partículas ven un
    # rayo "raro" (> 0.5 m de toda pared del mapa), ese rayo no cuenta. Así los
    # señuelos/víctimas/distractores no arrastran la estimación.
    # Mapa: el /map del juez que reenvía el explorador por /mapa_amcl; al
    # relocalizar le agrega los objetos fuera del mapa ya observados.
    map_topic: mapa_amcl
    use_sim_time: True
    alpha1: 0.6
    alpha2: 0.6
    alpha3: 0.6
    alpha4: 0.6
    alpha5: 0.6
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field_prob"
    max_beams: 80
    max_particles: 2000         
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Recupera diversidad automáticamente si cae la coincidencia del láser:
    # AMCL incorpora partículas aleatorias al detectar una hipótesis degradada.
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"   # X3 mecanum (holonómico)
    save_pose_rate: 0.5
    sigma_hit: 0.15
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.9
    z_max: 0.0
    z_rand: 0.1
    z_short: 0.0
    scan_topic: scan
    # La pose inicial la publica el nodo exploracion en /initialpose apenas
    # llega /map (el robot larga "cerca" del origen).
    set_initial_pose: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      footprint: "[[0.119, 0.100], [0.119, -0.100], [-0.181, -0.100], [-0.181, 0.100]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /exploracion/mapa_objetos
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.25      # radio normal de TODO el equipo: el explorador lo lee de acá al arrancar.
                                    # >= radio de giro del X3 con padding (0.22 m); si se traba lo baja hasta
                                    # inflacion_minima_m (exploracion.yaml) y después vuelve a este valor
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.119, 0.100], [0.119, -0.100], [-0.181, -0.100], [-0.181, 0.100]]"
      footprint_padding: 0.01
      # SIN static_layer a propósito: el costmap local (el que usa DWB para no
      # chocar) se arma SOLO con lo que el LiDAR ve ahora, que siempre está bien
      # ubicado respecto del robot. Con la capa del mapa, si AMCL se corría
      # 15-20 cm aparecía una pared "fantasma" encima del robot y DWB no
      # encontraba ninguna trayectoria válida ("No valid trajectories").
      # Las paredes reales igual aparecen: el LiDAR las ve.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Mismo margen y gradiente que el plan global para no apurar las esquinas.
        cost_scaling_factor: 6.0
        inflation_radius: 0.27      # mismo radio que el costmap global (el explorador usa el del global)
      always_send_full_costmap: True

controller_server:
  ros__parameters:
    use_sim_time: True
    # Conserva 15 Hz para actualizar el control; se reduce el muestreo de DWB
    # debajo para aliviar los "Control loop missed" observados en los logs.
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "portal_goal_checker"]
    controller_plugins: ["FollowPath"]
    # El explorador publica acá un % de velocidad máxima si empeora la localización.
    speed_limit_topic: "speed_limit"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      # La orientación final la resuelve el nodo exploracion con la acción
      # Spin (sólo cuando hace falta apuntar la cámara).
      yaw_goal_tolerance: 3.15
    portal_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 3.15
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: -0.25
      max_vel_x: 0.50
      min_vel_y: -0.50
      max_vel_y: 0.50
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.50        # módulo de (x, y): nunca más de 0.5 m/s en ninguna dirección
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 1.5
      acc_lim_theta: 2.5
      decel_lim_x: -2.0
      decel_lim_y: -2.0
      decel_lim_theta: -3.0
      vx_samples: 12
      vy_samples: 7
      vtheta_samples: 12
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      # Evalúa un tramo cercano del plan para rodear paredes sin perseguir
      # directamente una parte lejana de la trayectoria.
      shorten_transformed_plan: True
      prune_plan: True
      prune_distance: 1.0
      forward_prune_distance: 0.8
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "Twirling"]
      ObstacleFootprint.scale: 0.4
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 16.0
      Twirling.scale: 10.0

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # El launch reemplaza este valor por la ruta instalada de
    # behavior_trees/navegar_rapido.xml (sin "Wait 5 s" ni "Spin" en las
    # recuperaciones). Tiene que existir la clave: RewrittenYaml solo pisa
    # claves que ya están.
    default_nav_to_pose_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0   # el BT replanifica a 2 Hz
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # Más preciso que portal_goal_checker: no sustituir un portal por
      # una pose anterior al cruce aunque esté libre y cerca del destino.
      tolerance: 0.05
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    # Giros de la acción Spin (apuntar la cámara / relocalizar).
    max_rotational_vel: 0.8     # girando a 1 rad/s la imagen sale movida y el detector la descarta
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.5

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.50, 0.50, 1.0]
    min_velocity: [-0.25, -0.50, -1.0]
    max_accel: [1.5, 1.5, 2.5]
    max_decel: [-2.0, -2.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
