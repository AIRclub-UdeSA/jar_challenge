# Derived from AIRclub-UdeSA/jar_workshops semana-09-nav2 (MIT).
# Navigation only; M1 owns AMCL, judge owns /map.
# Smac 2D replaces NavFn after live path-extraction errors.
# Convex chassis/wheel footprint shared with M2; holonomic XY tracking.
# Short local goal horizon for tight maze bends; scoring checked against captured DWB candidates.
# Preserve workshop velocity sample counts; coarse sampling missed small legal lateral steps.
# Nav2 Omni lattice checks full-body routes. MPPI Omni follows path orientations.
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      always_send_full_costmap: true
      # Huella en marco del robot; no posiciones del mapa.
      footprint: '[[-0.19, -0.07], [-0.09268965743704353, -0.11513554308637906], [-0.08646913126175101,
        -0.11702251907194672], [-0.08, -0.11765967288841828], [0.08, -0.11765967288841828],
        [0.086469131261751, -0.11702251907194672], [0.09268965743704352, -0.11513554308637908],
        [0.09842252719347232, -0.11207126036061238], [0.113, -0.10250000000000001],
        [0.13, -0.07], [0.13, 0.07], [0.113, 0.10250000000000001], [0.09842252719347233,
        0.11207126036061238], [0.09268965743704352, 0.11513554308637908], [0.086469131261751,
        0.11702251907194672], [0.08, 0.11765967288841828], [-0.08, 0.11765967288841828],
        [-0.086469131261751, 0.11702251907194672], [-0.09268965743704352, 0.11513554308637908],
        [-0.19, 0.07]]'
      footprint_padding: 0.04
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      # Huella en marco del robot; no posiciones del mapa.
      footprint: '[[-0.19, -0.07], [-0.09268965743704353, -0.11513554308637906], [-0.08646913126175101,
        -0.11702251907194672], [-0.08, -0.11765967288841828], [0.08, -0.11765967288841828],
        [0.086469131261751, -0.11702251907194672], [0.09268965743704352, -0.11513554308637908],
        [0.09842252719347232, -0.11207126036061238], [0.113, -0.10250000000000001],
        [0.13, -0.07], [0.13, 0.07], [0.113, 0.10250000000000001], [0.09842252719347233,
        0.11207126036061238], [0.09268965743704352, 0.11513554308637908], [0.086469131261751,
        0.11702251907194672], [0.08, 0.11765967288841828], [-0.08, 0.11765967288841828],
        [-0.086469131261751, 0.11702251907194672], [-0.09268965743704352, 0.11513554308637908],
        [-0.19, 0.07]]'
      footprint_padding: 0.02
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.07
      yaw_goal_tolerance: 0.12
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 30
      model_dt: 0.1
      batch_size: 1000
      vx_std: 0.12
      vy_std: 0.12
      wz_std: 0.25
      vx_max: 0.2
      vx_min: -0.15
      vy_max: 0.15
      wz_max: 0.4
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: Omni
      visualize: false
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 8
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerLattice
      tolerance: 0.08
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      allow_reverse_expansion: true
      cache_obstacle_heuristic: false
      rotation_penalty: 5.0
      reverse_penalty: 1.2
      change_penalty: 0.1
      non_straight_penalty: 1.1
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 1.0
      smooth_path: false
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
